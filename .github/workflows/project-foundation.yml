name: Project foundation

on:
  push:
    branches: [project-office]
  pull_request:
    branches: [main, project-office]

permissions:
  contents: read

jobs:
  foundation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Verify branch isolation
        run: |
          git fetch origin +refs/heads/main:refs/remotes/origin/main
          changed=$(git diff --name-only origin/main...HEAD)
          if echo "$changed" | grep -E '^(apps/sheets/|apps/web/src/screens/ExcelEditor|apps/web/src/screens/excel/|packages/xlsx-gateway/|packages/docx-engine/)' ; then
            echo 'Project foundation changed a forbidden Excel/frozen surface.' >&2
            exit 1
          fi
      - name: Verify frozen specification set
        run: |
          for f in architecture-lock.md architecture.md requirements.md work-items.md dependency-graph.md verification-matrix.md; do
            test -f "spec/project/$f" || { echo "Missing spec/project/$f" >&2; exit 1; }
          done
      - name: Verify foundation package boundaries
        run: |
          ! grep -R -nE "from ['\"]react|from ['\"]electron|from ['\"]node:|from ['\"]http|from ['\"]https" packages/project-contracts packages/project-engine packages/project-scheduling packages/project-file packages/project-renderer-core --include='*.ts'
      - name: Typecheck contracts
        run: npm run typecheck -w @genoffice/project-contracts
      - name: Test contracts
        run: npm test -w @genoffice/project-contracts
      - name: Typecheck engine
        run: npm run typecheck -w @genoffice/project-engine
      - name: Test engine
        run: npm test -w @genoffice/project-engine
      - name: Typecheck scheduling
        run: npm run typecheck -w @genoffice/project-scheduling
      - name: Test scheduling
        run: npm test -w @genoffice/project-scheduling
      - name: Typecheck project-file
        run: npm run typecheck -w @genoffice/project-file
      - name: Test project-file
        run: npm test -w @genoffice/project-file
      - name: Typecheck project-renderer-core
        run: npm run typecheck -w @genoffice/project-renderer-core
      - name: Test project-renderer-core
        run: npm test -w @genoffice/project-renderer-core
      - name: Typecheck project-host
        run: npm run typecheck -w @genoffice/project-host
      - name: Test project-host
        run: npm test -w @genoffice/project-host
      - name: Typecheck project-desktop
        run: npm run typecheck -w @genoffice/project-desktop
      - name: Test project-desktop
        run: npm test -w @genoffice/project-desktop
      - name: Typecheck project-web
        run: npm run typecheck -w @genoffice/project-web
      - name: Test project-web
        run: npm test -w @genoffice/project-web
      - name: Setup Java (MPXJ sidecar)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Fetch MPP sidecar dependencies
        run: node packages/project-mpp-host/scripts/fetch-sidecar-deps.mjs
      - name: Typecheck project-mpp-host
        run: npm run typecheck -w @genoffice/project-mpp-host
      - name: Test project-mpp-host
        run: npm test -w @genoffice/project-mpp-host

  # PROJECT-027 — desktop E2E: boots the real built Electron app (main +
  # preload + renderer binding the shared renderer core) under xvfb and
  # drives the full native transport → adapter → engine → scheduler →
  # projection pipeline (Playwright `electron.launch`, the repo-wide e2e
  # job's platform pinning: 22.04's AppArmor policy is the documented
  # working baseline for Electron renderers under xvfb).
  desktop-e2e:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Download the Electron runtime
        run: node node_modules/electron/install.js
      - name: Build the Project desktop app
        run: npm run build -w @genoffice/project-desktop
      - name: Allow unprivileged user namespaces (Electron)
        run: |
          if sysctl kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          else
            echo "kernel.apparmor_restrict_unprivileged_userns not present — skipping"
          fi
      - name: Desktop E2E (Electron)
        env:
          DEBUG: 'pw:browser'
        run: xvfb-run --auto-servernum -- npm run test:e2e -w @genoffice/project-desktop
      - name: Upload E2E artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: project-desktop-e2e-artifacts
          path: |
            apps/project/e2e/test-results
          retention-days: 7
          if-no-files-found: ignore

  # PROJECT-028 — web E2E: builds the real production bundle of the Project
  # web shell (the shared @genoffice/project-host binding + the web
  # transport, mounted by Vite with NO Node/Electron polyfills), statically
  # scans that bundle for Node/Electron markers (the structural "no
  # Node/Electron dependencies in the browser-side implementation" proof),
  # and drives the full browser pipeline in headless chromium via
  # Playwright (picker/drag-and-drop/adapter → engine → scheduler →
  # projection, download saves, beforeunload guard, determinism, bounded
  # web reads).
  web-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Install Playwright chromium
        run: npx playwright install --with-deps chromium
      - name: Build the Project web app
        run: npm run build -w @genoffice/project-web
      - name: Scan the built bundle (no Node/Electron in the browser-side implementation)
        run: |
          if grep -rEn 'electron|node:fs|node:path|node:os|node:child_process|node:url|require\(.node:' apps/project-web/dist/ ; then
            echo 'The web bundle carries a Node/Electron marker — the browser-side implementation must import none of it.' >&2
            exit 1
          fi
      - name: Web E2E (chromium)
        run: npm run test:e2e -w @genoffice/project-web
      - name: Upload E2E artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: project-web-e2e-artifacts
          path: |
            apps/project-web/e2e/test-results
          retention-days: 7
          if-no-files-found: ignore
