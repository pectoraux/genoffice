name: Project foundation

on:
  push:
    branches: [project-office]
  pull_request:
    branches: [main, project-office]

permissions:
  contents: read

jobs:
  foundation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Verify branch isolation
        run: |
          git fetch origin main --depth=1
          changed=$(git diff --name-only origin/main...HEAD)
          if echo "$changed" | grep -E '^(apps/sheets/|apps/web/src/screens/ExcelEditor|apps/web/src/screens/excel/|packages/xlsx-gateway/|packages/docx-engine/)' ; then
            echo 'Project foundation changed a forbidden Excel/frozen surface.' >&2
            exit 1
          fi
      - name: Verify frozen specification set
        run: |
          for f in architecture-lock.md architecture.md requirements.md work-items.md dependency-graph.md verification-matrix.md; do
            test -f "spec/project/$f" || { echo "Missing spec/project/$f" >&2; exit 1; }
          done
      - name: Verify foundation package boundaries
        run: |
          ! grep -R -nE "from ['\"]react|from ['\"]electron|from ['\"]node:|from ['\"]http|from ['\"]https" packages/project-contracts packages/project-engine packages/project-scheduling packages/project-file packages/project-renderer-core --include='*.ts'
      - name: Typecheck contracts
        run: npm run typecheck -w @genoffice/project-contracts
      - name: Test contracts
        run: npm test -w @genoffice/project-contracts
      - name: Typecheck engine
        run: npm run typecheck -w @genoffice/project-engine
      - name: Test engine
        run: npm test -w @genoffice/project-engine
      - name: Typecheck scheduling
        run: npm run typecheck -w @genoffice/project-scheduling
      - name: Test scheduling
        run: npm test -w @genoffice/project-scheduling
      - name: Typecheck project-file
        run: npm run typecheck -w @genoffice/project-file
      - name: Test project-file
        run: npm test -w @genoffice/project-file
      - name: Typecheck project-renderer-core
        run: npm run typecheck -w @genoffice/project-renderer-core
      - name: Test project-renderer-core
        run: npm test -w @genoffice/project-renderer-core
      - name: Setup Java (MPXJ sidecar)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Fetch MPP sidecar dependencies
        run: node packages/project-mpp-host/scripts/fetch-sidecar-deps.mjs
      - name: Typecheck project-mpp-host
        run: npm run typecheck -w @genoffice/project-mpp-host
      - name: Test project-mpp-host
        run: npm test -w @genoffice/project-mpp-host
